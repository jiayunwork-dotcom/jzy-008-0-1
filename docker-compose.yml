services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kinematics
      POSTGRES_USER: kinematics
      POSTGRES_PASSWORD: kinematics
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinematics -d kinematics"]
      interval: 5s
      timeout: 3s
      retries: 20

  kinematics-service:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KIN_STORAGE: pg
      DATABASE_URL: postgres://kinematics:kinematics@postgres:5432/kinematics
      PORT: "3000"
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
